# Dispositivo ALSA 'convertQBO', el que usa todo el TTS del robot
# (aplay -D convertQBO). Agregar al final de /etc/asound.conf.
#
# RECONSTRUIDO, SIN PROBAR EN EL ROBOT. El /etc/asound.conf original de la SSD
# vieja no esta en el repo ni en el snapshot de /home/pi; solo queda el
# fragmento pegado en docs/QBO-AUDIO-sndrpisimplecar.md. Diferencia con ese
# fragmento: la tarjeta se nombra (sndrpisimplecar) en vez de usar hw:1,0,
# porque en Raspbian 13 la tarjeta 1 es el HDMI.
#
# Requiere que exista la tarjeta 'sndrpisimplecar' (modulo my_loader):
#   aplay -l | grep sndrpisimplecar

pcm_slave.sl1 {
    pcm "hw:sndrpisimplecar,0"
    channels 2
    rate 16000
    format S16_LE
}

pcm.convertQBO {
    type plug
    slave sl1
}
